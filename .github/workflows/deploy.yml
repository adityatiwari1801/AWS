name: Deploy

on:
  push:
    branches: [main, ci/cd-CF]
    paths:
      - "infra/**"
      - "lambda_function.py"
      - "glue_job.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      import_mode:
        description: "One-time only: import existing console-created resources into the stack instead of a normal update"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Record pre-deploy stack state
        id: pre_deploy_state
        run: |
          # A stack that doesn't exist yet means this run creates everything (bucket, Lambda
          # permission, S3 event notification) from scratch, which needs more propagation time
          # before S3 will actually start firing events than a stack that's just being updated.
          STATUS=$(aws cloudformation describe-stacks --stack-name "${{ vars.CFN_STACK_NAME }}" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "MISSING")
          echo "Pre-deploy stack status: $STATUS"
          echo "fresh_create=$([ "$STATUS" = "MISSING" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Package Lambda
        run: zip lambda_function.zip lambda_function.py

      - name: Upload assets (Lambda zip + Glue script)
        run: |
          aws s3 cp lambda_function.zip "s3://${{ vars.ASSETS_BUCKET }}/lambda_function.zip"
          aws s3 cp glue_job.py "s3://${{ vars.ASSETS_BUCKET }}/glue_job.py"

      - name: Import existing resources (one-time)
        if: ${{ inputs.import_mode == true }}
        run: |
          aws cloudformation create-change-set \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --change-set-name import-existing-resources \
            --change-set-type IMPORT \
            --resources-to-import file://infra/import-resources.json \
            --template-body file://infra/import-template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameters ParameterKey=AssetsBucketName,ParameterValue=${{ vars.ASSETS_BUCKET }}

          aws cloudformation wait change-set-create-complete \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --change-set-name import-existing-resources

          aws cloudformation execute-change-set \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --change-set-name import-existing-resources

          aws cloudformation wait stack-import-complete \
            --stack-name "${{ vars.CFN_STACK_NAME }}"

      - name: Create base resources (first-time, no pre-existing resources)
        if: ${{ inputs.import_mode != true }}
        run: |
          aws cloudformation deploy \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --template-file infra/import-template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides AssetsBucketName=${{ vars.ASSETS_BUCKET }} \
            --no-fail-on-empty-changeset

      - name: Seed input/ prefix marker
        run: |
          aws s3api put-object --bucket bootcamp-input --key input/

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --template-file infra/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides AssetsBucketName=${{ vars.ASSETS_BUCKET }} \
            --no-fail-on-empty-changeset

      - name: Show stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${{ vars.CFN_STACK_NAME }}" \
            --query "Stacks[0].Outputs" \
            --output table >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for S3 event notification to go live
        run: |
          # On a fresh stack create the bucket, the Lambda resource policy, and the
          # NotificationConfiguration are all brand new and can take a few minutes to actually
          # start delivering events -- much longer than the lag on a stack that's just updating.
          # Poll the live config instead of guessing, so we don't burn upload attempts on a
          # notification that isn't wired up yet.
          FRESH_CREATE="${{ steps.pre_deploy_state.outputs.fresh_create }}"
          if [ "$FRESH_CREATE" = "true" ]; then
            MAX_CHECKS=24
          else
            MAX_CHECKS=6
          fi
          for check in $(seq 1 "$MAX_CHECKS"); do
            CONFIG=$(aws s3api get-bucket-notification-configuration --bucket bootcamp-input --query "LambdaFunctionConfigurations" --output text 2>/dev/null || echo "")
            if [ -n "$CONFIG" ] && [ "$CONFIG" != "None" ]; then
              echo "Bucket notification is live (check $check/$MAX_CHECKS)"
              exit 0
            fi
            echo "Bucket notification not live yet (check $check/$MAX_CHECKS), waiting 10s..."
            sleep 10
          done
          echo "::warning::Bucket notification still not visible after waiting -- proceeding anyway, but the trigger step will likely need its retries."

      - name: Trigger pipeline (upload sample CSV, retrying until the Glue workflow actually starts)
        run: |
          # CloudFormation re-applies the bucket's NotificationConfiguration on every deploy, and S3
          # can take longer than a fixed sleep to activate it. Instead of guessing a delay, upload and
          # poll for the workflow run to actually start, re-uploading if it hasn't after a short wait.
          # A fresh stack create gets a bigger budget since everything in the chain is brand new.
          FRESH_CREATE="${{ steps.pre_deploy_state.outputs.fresh_create }}"
          if [ "$FRESH_CREATE" = "true" ]; then
            ATTEMPTS=10
          else
            ATTEMPTS=5
          fi
          for attempt in $(seq 1 "$ATTEMPTS"); do
            aws s3 cp ipl_players_extra.csv "s3://bootcamp-input/input/ipl_players_extra.csv"
            sleep 45
            RUN_ID=$(aws glue get-workflow --name "${{ vars.GLUE_WORKFLOW_NAME || 'glue-pipeline' }}" --query "Workflow.LastRun.WorkflowRunId" --output text 2>/dev/null || echo "None")
            if [ "$RUN_ID" != "None" ] && [ -n "$RUN_ID" ]; then
              echo "Glue workflow run started: $RUN_ID (attempt $attempt)"
              exit 0
            fi
            echo "No workflow run detected yet after attempt $attempt, retrying upload..."
          done
          echo "::error::Glue workflow never started after $ATTEMPTS upload attempts -- check the bucket's NotificationConfiguration and the Lambda's resource policy."
          exit 1
