name: Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_stack_name:
        description: "Type the exact CloudFormation stack name to confirm deletion"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental runs
        run: |
          if [ "${{ inputs.confirm_stack_name }}" != "${{ vars.CFN_STACK_NAME }}" ]; then
            echo "::error::confirm_stack_name did not match CFN_STACK_NAME (${{ vars.CFN_STACK_NAME }}). Aborting."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Empty S3 buckets (CloudFormation cannot delete non-empty buckets)
        run: |
          aws s3 rm "s3://bootcamp-input" --recursive || true
          aws s3 rm "s3://bootcamp-output" --recursive || true

      - name: Delete stack
        run: |
          aws cloudformation delete-stack --stack-name "${{ vars.CFN_STACK_NAME }}"
          aws cloudformation wait stack-delete-complete --stack-name "${{ vars.CFN_STACK_NAME }}"

      - name: Report
        run: echo "Stack ${{ vars.CFN_STACK_NAME }} deleted." >> "$GITHUB_STEP_SUMMARY"
