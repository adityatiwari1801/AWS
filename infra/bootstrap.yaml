AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: GitHub OIDC provider, the deploy role assumed by GitHub Actions,
  and the assets bucket used to stage the Lambda zip and glue_job.py before each deploy.
  Deploy this once by hand (console or `aws cloudformation deploy`) BEFORE the first
  Deploy workflow run. It is intentionally separate from infra/template.yaml so the
  pipeline stack's own deploy/destroy cycle never touches the credentials that manage it.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org/user that owns the repo, e.g. octocat
  GitHubRepo:
    Type: String
    Description: Repo name only, e.g. AWS_CICD
  AssetsBucketName:
    Type: String
  CfnStackName:
    Type: String
    Default: bootcamp-pipeline
    Description: Name of the pipeline stack this role is allowed to manage (infra/template.yaml).

Conditions:
  # No OIDC provider for token.actions.githubusercontent.com exists in this account
  # (confirmed via `aws iam list-open-id-connect-providers`), so create one.
  CreateOidcProvider: !Equals [true, true]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1b511abead59c6ce207077c0ef0e0d6b568b2705

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref AssetsBucketName

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActions-BootcampPipeline-Deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub sends the plain "repo:OWNER/REPO:*" sub claim normally, but switches to the
                # ID-qualified "repo:OWNER@ownerId/REPO@repoId:*" form if the org or repo was ever
                # renamed/transferred (to stop an old claim being replayed against the new name).
                # This repo/org has such history, so match both forms.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:*
                  - !Sub repo:${GitHubOrg}@313818176/${GitHubRepo}@1358041430:*
      Policies:
        - PolicyName: DeployBootcampPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource:
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:stack/${CfnStackName}/*
                  - !Sub arn:aws:cloudformation:*:${AWS::AccountId}:changeSet/*/*
              - Effect: Allow
                # GetTemplateSummary/ValidateTemplate don't support resource-level permissions
                # (AWS requires Resource: "*" for these two specifically) -- `aws cloudformation
                # deploy` calls GetTemplateSummary internally to resolve template parameters.
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - arn:aws:s3:::bootcamp-input
                  - arn:aws:s3:::bootcamp-input/*
                  - arn:aws:s3:::bootcamp-output
                  - arn:aws:s3:::bootcamp-output/*
                  - !Sub arn:aws:s3:::${AssetsBucketName}
                  - !Sub arn:aws:s3:::${AssetsBucketName}/*
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:function:bootcamp-function
              - Effect: Allow
                Action:
                  - glue:*
                # Matches the specific Glue objects declared in infra/template.yaml. Table names
                # are wildcarded since the crawlers create/update them dynamically at runtime.
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/glue_db
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/glue_db/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/Glue_Input
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/Glue_output
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/glue_job
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:workflow/glue-pipeline
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:trigger/glue-start
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:trigger/inter1
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:trigger/Inter2
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - arn:aws:iam::*:role/Bootcamp-Lambda
                  - arn:aws:iam::*:role/Bootcamp-Glue
                  - arn:aws:iam::*:role/Bootcamp-Glue-Role
                  - arn:aws:iam::*:role/Bootcamp-Crawler
                  - arn:aws:iam::*:role/Bootcamp-Crawler-Input

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
  AssetsBucketNameOut:
    Value: !Ref AssetsBucket
